name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  apk-debug:
    name: Compilar APK instalavel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

       - name: Configurar Android SDK
    uses: android-actions/setup-android@v3
    with:
    packages: platform-tools

      - name: Instalar Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configurar Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Compilar APK de teste
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ForjaGym-APK-instalavel
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
